<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Autosar Demo</title>
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
    <style>
        :root {
            --box-bg: #f3f0ff;
            --box-border: #c8baff;
            --callout-bg: #f4f5f7;
            --callout-border: #e5e7ef;
            --line: #6b5ae0;
        }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 22px; font-family: Arial, Helvetica, sans-serif; background: #fafafa; color: #222; }
        h1 { text-align: center; margin: 0 0 16px; font-size: 22px; }

        .stage { position: relative; max-width: 1024px; margin: 0 auto; padding: 18px; background: #fff; border: 1px solid #eee; }

        .grid {
            position: relative;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-auto-rows: minmax(64px, auto);
            gap: 26px 0px;
            align-items: center;
        }

        .node { padding: 12px 16px; border: 2px solid var(--box-border); background: var(--box-bg); text-align: center; font-weight: 600; border-radius: 0; }
        .center { grid-column: 2; background: #efeaff; border-color: #b7a7ff; margin-bottom: 60px; margin-top: 60px; }
        .callout { background: var(--callout-bg); border-color: var(--callout-border); font-weight: 500; color: #3a3a3a; border-radius: 0; }

        /* SVG connectors */
        .wires { position: absolute; inset: 0; pointer-events: none; }
        .wires line { stroke: var(--line); stroke-width: 1.5; marker-end: url(#arrowhead); }

        @media (max-width: 720px) {
            .grid { grid-template-columns: 1fr; gap: 20px; }
            #acc { order: 1; }
            #accMethod { order: 2; }
            #radar { order: 3; }
            #radarEvent { order: 4; }
            #center { order: 5; }
            #jsonMethod { order: 6; }
            #google { order: 7; }
            #someipMethod { order: 8; }
            #tsr { order: 9; }
        }
    </style>
</head>
<body>
<h1>Autosar Demo</h1>

<div class="stage" aria-label="System diagram">
    <svg class="wires" aria-hidden="true">
        <defs>
            <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
                <polygon points="0 0, 10 3.5, 0 7" fill="#6b5ae0" />
            </marker>
        </defs>
    </svg>

    <section class="grid">
        <div id="acc" class="node">Adaptive Cruise Control</div>
        <div></div>
        <div id="radar" class="node">Radar</div>

        <div id="accMethod" class="node callout">Max speed: 0</div>
        <div></div>
        <div id="radarEvent" class="node callout">Distance: 0<br/>Relative speed: 0</div>

        <div></div>
        <div id="center" class="node center">Path Planning and Decision Making</div>
        <div></div>

        <div id="jsonMethod" class="node callout">Speed limit: 0</div>
        <div></div>
        <div id="someipMethod" class="node callout">Speed limit: 0</div>

        <div id="google" class="node">Google Map</div>
        <div></div>
        <div id="tsr" class="node">Traffic Sign Recognition</div>
    </section>

    <!-- TODO: Temporary UI for showing websocket message, this will be removed in SVA-656 -->
    <div id="temporary" style="text-align: center; margin-top: 50px">Received web socket message: <span id="receivedMessages">none</span></div>
</div>

<script th:src="@{/js/sockjs.min.js}"></script>
<script th:src="@{/js/stomp.min.js}"></script>
<script>
    const pairs = [
        ['acc', 'accMethod'],
        ['accMethod', 'center'],
        ['radar', 'radarEvent'],
        ['radarEvent', 'center'],
        ['center', 'jsonMethod'],
        ['jsonMethod', 'google'],
        ['center', 'someipMethod'],
        ['someipMethod', 'tsr']
    ];

    const stage = document.querySelector('.stage');
    const svg = document.querySelector('.wires');

    function clearLines(){ svg.querySelectorAll('line').forEach(l => l.remove()); }
    function center(rect){ return { x: rect.left + rect.width*0.5, y: rect.top + rect.height*0.5 }; }
    function anchors(el1, el2){
        const r1 = el1.getBoundingClientRect();
        const r2 = el2.getBoundingClientRect();

        let from = { x: r1.left + r1.width/2, y: r1.bottom };
        let to   = { x: r2.left + r2.width/2, y: r2.top };

        if (el1.getAttribute('id') === 'accMethod') {
            to   = { x: r2.left + r2.width/3, y: r2.top };
        } else if (el1.getAttribute('id') === 'radarEvent') {
            to   = { x: r2.right - r2.width/3, y: r2.top };
        } else if (el2.getAttribute('id') === 'jsonMethod') {
            from = { x: r1.left + r1.width/3, y: r1.bottom };
        } else if (el2.getAttribute('id') === 'someipMethod') {
            from = { x: r1.right - r1.width/3, y: r1.bottom };
        }

        return { from, to };
    }
    function toLocal(p, rect){ return { x: p.x - rect.left, y: p.y - rect.top }; }

    function draw(){
        clearLines();
        const rect = stage.getBoundingClientRect();
        svg.setAttribute('viewBox', `0 0 ${rect.width} ${rect.height}`);
        svg.setAttribute('width', rect.width);
        svg.setAttribute('height', rect.height);
        for (const [a,b] of pairs){
            const el1 = document.getElementById(a);
            const el2 = document.getElementById(b);
            if(!el1 || !el2) continue;
            const {from, to} = anchors(el1, el2);
            const p1 = toLocal(from, rect);
            const p2 = toLocal(to, rect);
            const line = document.createElementNS('http://www.w3.org/2000/svg','line');
            line.setAttribute('x1', p1.x);
            line.setAttribute('y1', p1.y);
            line.setAttribute('x2', p2.x);
            line.setAttribute('y2', p2.y);
            svg.appendChild(line);
        }
    }

    const scheduleDraw = (()=>{ let raf; return ()=>{ cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); }; })();
    window.addEventListener('resize', scheduleDraw);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(scheduleDraw);
    scheduleDraw();

    // Web socket configuration
    function connectWebSocket() {
        const socket = new SockJS("/ws");
        stompClient = Stomp.over(socket);

        stompClient.connect({}, function() {
            stompClient.subscribe('/topic/someip_messages', function(message) {
                const receivedMessages = document.getElementById('receivedMessages');
                receivedMessages.textContent = message.body;
            });
        });

        stompClient.onerror = function(error) {
            console.error('Connection error:', error);
        };

        stompClient.onclose = function(event) {
            console.log('Connection closed', event);
        };
    }
    connectWebSocket();
</script>
</body>
</html>
