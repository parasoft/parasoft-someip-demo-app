<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Autosar Demo</title>
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
    <style>
        :root {
            --box-bg: #f3f0ff;
            --box-border: #c8baff;
            --callout-bg: #f4f5f7;
            --callout-border: #e5e7ef;
            --line: #6b5ae0;
        }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 22px; font-family: Arial, Helvetica, sans-serif; background: #fafafa; color: #222; }
        h1 { text-align: center; margin: 0 0 16px; font-size: 22px; }

        .stage { position: relative; max-width: 1024px; margin: 0 auto; padding: 18px; background: #fff; border: 1px solid #eee; }

        .grid {
            position: relative;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-auto-rows: minmax(64px, auto);
            gap: 26px 0px;
            align-items: center;
        }

        .node { padding: 12px 16px; border: 2px solid var(--box-border); background: var(--box-bg); text-align: center; font-weight: 600; border-radius: 0; }
        .ppdm { grid-column: 2; background: #b7a7ff; border-color: #b7a7ff; margin-bottom: 60px; margin-top: 60px; }
        .callout { background: var(--callout-bg); border-color: var(--callout-border); font-weight: 500; color: #3a3a3a; border-radius: 0; }
        .ecu.startup { background: #b7a7ff; border-color: #b7a7ff; }

        /* SVG connectors */
        .wires { position: absolute; inset: 0; pointer-events: none; }
        .wires line { stroke: var(--line); stroke-width: 1.5; }
        .wires .arrowLine { marker-end: url(#arrowhead); }

        @media (max-width: 720px) {
            .grid { grid-template-columns: 1fr; gap: 20px; }
            #acc { order: 1; }
            #accMethod { order: 2; }
            #radar { order: 3; }
            #radarEvent { order: 4; }
            #ppdm { order: 5; }
            #jsonMethod { order: 6; }
            #google { order: 7; }
            #someipMethod { order: 8; }
            #tsr { order: 9; }
        }
    </style>
</head>
<body>
<h1>Autosar Demo</h1>

<div class="stage" aria-label="System diagram">
    <svg class="wires" aria-hidden="true">
        <defs>
            <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
                <polygon points="0 0, 10 3.5, 0 7" fill="#6b5ae0" />
            </marker>
        </defs>
    </svg>

    <section class="grid">
        <div id="acc" class="node ecu acc">Adaptive Cruise Control</div>
        <div></div>
        <div id="radar" class="node ecu radar">Radar</div>

        <div id="accMethod" class="node callout acc">Max speed: <span id="accMaxSpeed" class="value">N/A</span></div>
        <div></div>
        <div id="radarEvent" class="node callout radar">Distance: <span id="radarDistance" class="value">N/A</span><br/>Relative speed: <span id="radarRelativeSpeed" class="value">N/A</span></div>

        <div></div>
        <div id="ppdm" class="node ecu ppdm">Path Planning and Decision Making</div>
        <div></div>

        <div id="jsonMethod" class="node callout googlemap">Speed limit: <span id="googleSpeedLimit">N/A</span></div>
        <div></div>
        <div id="someipMethod" class="node callout tsr">Speed limit: <span id="tsrSpeedLimit" class="value">N/A</span></div>

        <div id="google" class="node ecu googlemap startup">Google Map</div>
        <div></div>
        <div id="tsr" class="node ecu tsr">Traffic Sign Recognition</div>
    </section>
</div>

<script th:src="@{/js/sockjs.min.js}"></script>
<script th:src="@{/js/stomp.min.js}"></script>
<script>
    const pairs = [
        // arrow line
        ['ppdm', 'accMethod'],
        ['jsonMethod', 'ppdm'],
        ['someipMethod', 'ppdm'],
        ['radarEvent', 'ppdm'],
        // line
        ['acc', 'accMethod'],
        ['radar', 'radarEvent'],
        ['google', 'jsonMethod'],
        ['tsr', 'someipMethod']
    ];

    const stage = document.querySelector('.stage');
    const svg = document.querySelector('.wires');

    function clearLines() { svg.querySelectorAll('line').forEach(l => l.remove()); }
    function anchors(el1, el2) {
        const r1 = el1.getBoundingClientRect();
        const r2 = el2.getBoundingClientRect();

        let from = { x: r1.left + r1.width / 2, y: r1.top };
        let to = { x: r2.left + r2.width / 2, y: r2.bottom };

        if (el1.id === 'ppdm') {
            from = { x: r1.left + r1.width / 3, y: r1.top };
        } else if (el1.id === 'radarEvent') {
            from = { x: r1.left + r1.width / 2, y: r1.bottom };
            to = { x: r2.right - r2.width / 3, y: r2.top };
        } else if (el1.id === 'someipMethod') {
            to = { x: r2.right - r2.width / 3, y: r2.bottom };
        } else if (el1.id === 'jsonMethod') {
            to = { x: r2.left + r2.width / 3, y: r2.bottom };
        }

        return { from, to };
    }
    function toLocal(p, rect) { return { x: p.x - rect.left, y: p.y - rect.top }; }

    function draw() {
        clearLines();
        const rect = stage.getBoundingClientRect();
        svg.setAttribute('viewBox', `0 0 ${rect.width} ${rect.height}`);
        svg.setAttribute('width', rect.width);
        svg.setAttribute('height', rect.height);
        for (const [a,b] of pairs){
            const el1 = document.getElementById(a);
            const el2 = document.getElementById(b);
            if(!el1 || !el2) continue;
            const {from, to} = anchors(el1, el2);
            const p1 = toLocal(from, rect);
            const p2 = toLocal(to, rect);
            const line = document.createElementNS('http://www.w3.org/2000/svg','line');
            if (el1.id === 'ppdm' || el2.id === 'ppdm') {
               line.classList.add('arrowLine');
            }
            line.setAttribute('x1', p1.x);
            line.setAttribute('y1', p1.y);
            line.setAttribute('x2', p2.x);
            line.setAttribute('y2', p2.y);
            svg.appendChild(line);
        }
    }

    const scheduleDraw = (() => { let raf; return ()=>{ cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); }; })();
    window.addEventListener('resize', scheduleDraw);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(scheduleDraw);
    scheduleDraw();

    const ecuMessageHandlers = {
        ACC: (response) => {
            const value = getValue(response, 'maxSpeed');
            document.getElementById('accMaxSpeed').textContent = value;
        },

        RADAR: (response) => {
            const distance = getValue(response, 'distance');
            const relativeSpeed = getValue(response, 'relativeSpeed');

            document.getElementById('radarDistance').textContent = distance;
            document.getElementById('radarRelativeSpeed').textContent = relativeSpeed;
        },

        GOOGLEMAP: (response) => {
            document.getElementById('googleSpeedLimit').textContent = getValue(response, 'speedLimit');
        },

        TSR: (response) => {
            const value = getValue(response, 'speedLimit');
            document.getElementById('tsrSpeedLimit').textContent = value;
        }
    };

    function getValue(response, key) {
        var value = "N/A";
        if (response['errorMessage']) {
            console.error(`${response['ecuName']} Error: ${response['errorMessage']}`);
        } else if (response[key] === 0 || response[key]) {
            value = response[key];
        } else {
            console.error(`Key '${key}' missing in response from ${response['ecuName']}: `, response);
        }
        return value;
    }

    // Web socket configuration
    function connectWebSocket() {
        const socket = new SockJS("/ws");
        stompClient = Stomp.over(socket);

        stompClient.connect({}, function() {
            stompClient.subscribe('/topic/someip_messages', function(message) {
                try {
                    const response = JSON.parse(message.body);
                    var ecuName = response['ecuName'];
                    if (ecuName) {
                        ecuName = ecuName.toUpperCase();
                    } else {
                        console.error("ECU name missing in message: ", message);
                        return;
                    }

                    const type = response['type'];
                    const elements = document.getElementsByClassName(ecuName.toLowerCase());

                    for (let element of elements) {
                        element.classList.add('startup');
                    }
                    if (type === 'status_startup') {
                        return;
                    }
                    if (type === 'status_shutdown') {
                        for (let element of elements) {
                            element.classList.remove('startup');
                            const valueElements = element.querySelectorAll('.value');
                            valueElements.forEach(value => {
                                value.textContent = 'N/A';
                            });
                        }
                        return;
                    }

                    const messageHandler = ecuMessageHandlers[ecuName];

                    if (!messageHandler) {
                        console.error("No message handler for ECU: ", response['ecuName']);
                        return;
                    }
                    messageHandler(response);
                } catch (error) {
                    console.error("Failed to process ECU message: ", message);
                    console.error(error);
                }
            });
        });

        stompClient.onerror = function(error) {
            console.error('Connection error:', error);
        };

        stompClient.onclose = function(event) {
            console.log('Connection closed', event);
        };
    }
    connectWebSocket();
</script>
</body>
</html>
